version: 2
updates:
  # Rust dependency updates. New HMRC data arrives in hmrc-rates releases,
  # so these PRs update the rates compiled into cgt-tool.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Keep GitHub Actions in the workflows current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
