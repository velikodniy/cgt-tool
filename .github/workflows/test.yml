name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Make this workflow reusable
  workflow_call:
  # Manual trigger
  workflow_dispatch:

jobs:
  # Run pre-commit checks: formatting and linting (Clippy)
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: j178/prek-action@v2
  # Run all tests
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test web interface
        run: node --test web/*.test.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test comparison scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
  # Test WebAssembly target
  test-wasm:
    name: Test WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Test WASM
        run: |
          cd crates/cgt-wasm
          wasm-pack test --node
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test browser report with WASM
        run: |
          wasm-pack build crates/cgt-wasm --target nodejs --dev --out-dir "$RUNNER_TEMP/cgt-display-wasm"
          CGT_WASM_TEST_PKG="$RUNNER_TEMP/cgt-display-wasm" node --test web/app.test.mjs
