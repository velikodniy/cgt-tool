name: Update HMRC rates

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: update-hmrc-rates
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  update:
    name: Update hmrc-rates
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy
          target: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Update hmrc-rates and version
        id: update
        run: |
          cargo update --package hmrc-rates
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_version="$(sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' Cargo.toml)"
          IFS=. read -r major minor patch <<< "$current_version"
          new_version="${major}.${minor}.$((patch + 1))"
          sed -i "s/^version = \"${current_version}\"$/version = \"${new_version}\"/" Cargo.toml

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"

      - name: Check
        if: steps.update.outputs.changed == 'true'
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        if: steps.update.outputs.changed == 'true'
        run: cargo test --all

      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        if: steps.update.outputs.changed == 'true'

      - name: Test WASM
        if: steps.update.outputs.changed == 'true'
        working-directory: crates/cgt-wasm
        run: wasm-pack test --node

      - name: Commit, tag, and release
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          test -z "$(git diff --name-only | grep -vE '^(Cargo.lock|Cargo.toml)$' || true)"
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "2"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git -c core.hooksPath=/dev/null commit -m "chore: update hmrc-rates and bump version to ${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION} - Update HMRC rates"

          gh auth setup-git
          git -c core.hooksPath=/dev/null push --atomic origin HEAD:main "v${VERSION}"
          gh workflow run release.yml --ref "v${VERSION}" -f tag="v${VERSION}"
