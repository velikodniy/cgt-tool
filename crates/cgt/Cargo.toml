[package]
name = "cgt"
version.workspace = true
edition.workspace = true

[dependencies]
num-bigint = "0.4.8"
num-rational = "0.4.2"
num-traits = "0.2.19"
pest = "2.9.1"
pest_derive = "2.9.1"
pest_consume = "1.1.3"
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
thiserror = "2.0.20"
schemars = { version = "1.2.2", features = ["rust_decimal1", "chrono04"] }
toml = "1.1.6"
iso_currency = "0.7.1"
hmrc-rates = "0.3.3"

[lints]
workspace = true

[dev-dependencies]
rust_decimal_macros = "1.40.0"
