[package]
name = "cgt-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "cgt-tool"
path = "src/main.rs"

[dependencies]
cgt = { path = "../cgt" }
cgt-pdf = { path = "../cgt-pdf" }
cgt-converter = { path = "../cgt-converter" }
clap = { version = "4.6.6", features = ["derive"] }
anyhow = "1.0.104"
serde_json = "1.0.151"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
